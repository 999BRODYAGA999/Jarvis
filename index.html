<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JARVIS DEBUG</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 10px; }
        #debug-log { background: #111; padding: 10px; border: 1px solid #0f0; margin-bottom: 10px; min-height: 50px; font-size: 14px; }
        #history { height: 40vh; overflow-y: auto; border: 1px solid #0f0; padding: 10px; margin-bottom: 10px; }
        button { background: #0f0; color: #000; border: none; padding: 20px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div style="font-size: 12px;">Система слышит (для отладки):</div>
    <div id="debug-log">...</div>
    <div id="history"></div>
    <button onclick="start()">АКТИВИРОВАТЬ</button>

    <script>
        const log = document.getElementById("debug-log");
        const hist = document.getElementById("history");

        function speak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = "ru-RU";
            window.speechSynthesis.speak(u);
            hist.innerHTML += `<div>JARVIS: ${text}</div>`;
        }

        function process(raw) {
            const t = raw.toLowerCase().trim();
            log.innerText = t; // ВЫВОДИМ ТО, ЧТО УСЛЫШАЛИ

            // Простая логика без сложных условий
            if (t.includes("статус")) {
                speak("Статус системы нормальный.");
                return;
            }
            if (t.includes("время")) {
                speak("Сейчас " + new Date().toLocaleTimeString());
                return;
            }
            
            speak("Слушаю вас.");
        }

        function start() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = "ru-RU"; 
            rec.continuous = true;
            rec.interimResults = false;
            
            rec.onresult = (e) => {
                const text = e.results[e.results.length - 1][0].transcript;
                process(text);
            };
            
            rec.onerror = (e) => { log.innerText = "Ошибка: " + e.error; };
            rec.start();
            log.innerText = "Микрофон включен...";
        }
    </script>
</body>
</html>
