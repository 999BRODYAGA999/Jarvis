<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JARVIS CONSTANT</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 10px; display: flex; flex-direction: column; height: 95vh; }
        #history { flex: 1; overflow-y: auto; border: 1px solid #0f0; padding: 10px; margin-bottom: 10px; }
        .controls { display: flex; gap: 5px; }
        input { flex: 1; background: #111; color: #0f0; border: 1px solid #0f0; padding: 10px; }
        button { background: #0f0; color: #000; border: none; padding: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="history"></div>
    <div class="controls">
        <input type="text" id="userInput" placeholder="Команда..." onkeydown="if(event.key==='Enter') sendText()">
        <button onclick="sendText()">ОТПРАВИТЬ</button>
        <button onclick="start()">ГОЛОС</button>
    </div>

    <script>
        const hist = document.getElementById("history");
        const input = document.getElementById("userInput");
        let protocols = JSON.parse(localStorage.getItem("jarvis_protocols")) || {};

        function speak(text) { 
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = "ru-RU";
            window.speechSynthesis.speak(u);
            hist.innerHTML += `<div>JARVIS: ${text}</div>`;
        }

        function process(raw) {
            const t = raw.toLowerCase().trim();
            hist.innerHTML += `<div>USER: ${t}</div>`;
            
            // 1. Создание протокола (Гибкий поиск)
            if (t.includes("протокол") && t.includes("ответ")) {
                const parts = t.split("ответ");
                const name = parts[0].replace(/создай|новый|протокол/g, "").replace(/['"]/g, "").trim();
                const content = parts[1].trim();
                protocols[name] = content;
                localStorage.setItem("jarvis_protocols", JSON.stringify(protocols));
                speak("Принято.");
                return;
            }

            // 2. Математика
            if (/[\d\+\-\*\/\.]/.test(t)) {
                try {
                    const mathExpr = t.replace(/[^-()\d/*+.]/g, '');
                    const res = eval(mathExpr);
                    speak(res.toString());
                    return;
                } catch(e) {}
            }

            // 3. Команды
            if (t.includes("время")) { speak(new Date().toLocaleTimeString()); return; }
            if (t.includes("статус")) { speak("Система в норме."); return; }
            
            // 4. Поиск протокола
            for (let key in protocols) {
                if (t.includes(key)) { speak(protocols[key]); return; }
            }
            
            speak("Готов.");
        }

        function sendText() {
            if (input.value.trim() !== "") {
                process(input.value);
                input.value = "";
            }
        }

        function start() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = "ru-RU"; 
            rec.onresult = (e) => {
                process(e.results[e.results.length - 1][0].transcript);
            };
            rec.start();
        }
    </script>
</body>
</html>
